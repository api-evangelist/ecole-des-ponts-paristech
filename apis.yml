description: >-
  École des Ponts ParisTech (École nationale des ponts et chaussées, ENPC) is a public
  French grande école of engineering founded in 1747, based in Champs-sur-Marne and a
  founding member of ParisTech. Its programmable footprint is small and must be read
  honestly: ENPC operates no public API programme, no developer portal and no API key
  issuance — api.enpc.fr and api.ecoledesponts.fr do not resolve, and there is no
  developer section anywhere in the 1,910-URL sitemap of ecoledesponts.fr. The single
  machine-readable contract ENPC genuinely operates itself is its SAML 2.0 Identity
  Provider metadata at idp.enpc.fr, whose entityID is registered in the RENATER
  Fédération Éducation-Recherche and therefore reachable through eduGAIN. Everything
  else that looks like an ENPC API is a tenant relationship on someone else's platform:
  the open-access repository is the ENPC collection inside the national HAL platform
  operated by CCSD; the research-data repository is the ecoledesponts collection inside
  the national Recherche Data Gouv Dataverse; and the heritage digital library, though
  served under heritage.ecoledesponts.fr, is a Gallica Marque Blanche deployment hosted
  on BnF infrastructure with BnF ARKs and BnF attribution. Those are real institutional
  facts and are recorded as tenant surfaces — the data is ENPC's, the contract is not.
