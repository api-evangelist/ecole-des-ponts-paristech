x-coverage:
  state: none
  reason: no_public_api
  detail: >-
    ENPC publishes no public API, no developer portal and no OpenAPI. Probed and found
    absent: api.enpc.fr, api.ecoledesponts.fr, data.enpc.fr, data.ecoledesponts.fr
    (all DNS-unresolvable), /llms.txt and /.well-known/security.txt on the main site
    (404). One institution-operated machine-readable contract exists and is recorded —
    the SAML 2.0 IdP metadata at idp.enpc.fr. Every other programmable surface belongs
    to a national or vendor platform on which ENPC is a tenant: HAL (CCSD),
    Recherche Data Gouv (Dataverse), and Gallica Marque Blanche (BnF), the last of
    which runs under an ENPC hostname that resolves into BnF address space. The
    previous profile recorded the generic national HAL endpoints at
    api.archives-ouvertes.fr as ENPC's own APIs; they are shared national
    infrastructure used by every French institution and have been re-labelled as a
    single tenant relationship. Two soft-200 traps were found and are NOT recorded as
    surfaces: the heritage SRU route returns the HTML search page for every request
    including operation=explain, and idp.enpc.fr answers every unknown path, including
    /.well-known/openid-configuration, with the LemonLDAP::NG portal shell. The HAL
    portal enpc.hal.science answers 200 with an Anubis bot challenge — live, not dead.
    A dead pointer was removed: the previous Library pointer lib.enpc.fr now redirects
    off-domain to an unrelated research demo at aikon-demo.huma-num.fr, and the
    previous Twitter pointer 404s with no X account linked from the ENPC homepage.
