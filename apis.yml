apis:
  - aid: ecole-des-ponts-paristech:saml-idp
    name: ENPC SAML 2.0 Identity Provider Metadata
    x-operator: institution
    description: >-
      The one machine-readable contract École des Ponts ParisTech operates on its own
      infrastructure. A live SAML 2.0 EntityDescriptor served as application/xml from
      idp.enpc.fr, declaring SingleSignOnService over HTTP-Redirect, HTTP-POST and
      HTTP-Artifact, SingleLogoutService over SOAP, HTTP-Redirect and HTTP-POST, an
      ArtifactResolutionService and an AttributeAuthorityDescriptor. OrganizationName
      reads "École des Ponts ParisTech" and OrganizationURL https://www.enpc.fr. The
      entityID https://idp.enpc.fr/saml/metadata appears in the RENATER Fédération
      Éducation-Recherche main IdP aggregate, so federation membership is confirmed
      from the federation's own metadata rather than from an institutional claim.
      Software is LemonLDAP::NG, not Shibboleth. This authenticates people into
      federated services; it is not a developer-accessible API.
    humanURL: https://idp.enpc.fr/
    baseURL: https://idp.enpc.fr/saml/
    tags: [ Identity Federation, SAML, Single Sign-On, RENATER, eduGAIN ]
    properties:
      - type: Metadata
        url: https://idp.enpc.fr/saml/metadata
      - type: Authentication
        url: authentication/ecole-des-ponts-paristech-authentication.yml
      - type: Conformance
        url: conformance/ecole-des-ponts-paristech-conformance.yml
  - aid: ecole-des-ponts-paristech:hal-enpc
    name: HAL — ENPC Open-Access Collection (tenant)
    x-operator: tenant
    description: >-
      ENPC's institutional open-access repository is the ENPC collection inside HAL,
      the French national open archive operated by CCSD/CNRS, with an ENPC-branded
      portal at enpc.hal.science. 43,955 records, 31,437 of them carrying author ORCID
      iDs. Machine access exists in two forms, both on CCSD's shared national host and
      scoped to ENPC by path or set selector: the Solr search API at
      api.archives-ouvertes.fr/search/ENPC/ and the OAI-PMH 2.0 provider with
      set=collection:ENPC. Recorded as ONE tenant relationship, not as separate APIs:
      api.archives-ouvertes.fr is generic national infrastructure shared by every
      French research institution and its contract is CCSD's, not ENPC's. The portal
      host answers 200 with an Anubis bot challenge.
    humanURL: https://enpc.hal.science/
    baseURL: https://api.archives-ouvertes.fr/search/ENPC/
    tags: [ Research, Open Access, Repository, Metadata, Publications, OAI-PMH, ORCID ]
    properties:
      - type: Documentation
        url: https://api.archives-ouvertes.fr/docs/search
      - type: ResearchRepository
        url: https://enpc.hal.science/
    x-operator-detail: >-
      Platform operator: CCSD (Centre pour la Communication Scientifique Directe),
      CNRS. Institution role: collection owner and depositor.
  - aid: ecole-des-ponts-paristech:recherche-data-gouv
    name: Recherche Data Gouv — ENPC Dataverse Collection (tenant)
    x-operator: tenant
    description: >-
      ENPC's research-data repository is the collection with alias "ecoledesponts"
      (id 148870, dataverseType ORGANIZATIONS_INSTITUTIONS, created 2022-09-13) inside
      Recherche Data Gouv, the French national Dataverse. Curated by ENPC staff — the
      registered dataverseContacts are @enpc.fr addresses — and holding 25 datasets
      across four laboratory sub-collections: CERMICS, HM&Co, Laboratoire Navier and
      CEREA. Datasets carry DataCite DOIs under the national 10.57745 prefix. Readable
      through the Dataverse Native API scoped to the collection alias. The data and the
      curation are ENPC's; the platform, the API contract and the DOI prefix are the
      national repository's.
    humanURL: https://entrepot.recherche.data.gouv.fr/dataverse/ecoledesponts
    baseURL: https://entrepot.recherche.data.gouv.fr/api/dataverses/ecoledesponts
    tags: [ Research Data, Repository, Dataverse, DataCite, DOI, Open Science ]
    properties:
      - type: ResearchRepository
        url: https://entrepot.recherche.data.gouv.fr/dataverse/ecoledesponts
      - type: Conformance
        url: conformance/ecole-des-ponts-paristech-conformance.yml
    x-operator-detail: >-
      Platform operator: Recherche Data Gouv (MESR / INRAE), Dataverse software.
      Institution role: collection owner, curator and depositor.
  - aid: ecole-des-ponts-paristech:heritage-iiif
    name: L'Héritage des Ponts et Chaussées — IIIF Presentation API (tenant)
    x-operator: tenant
    description: >-
      ENPC's heritage digital library, holding more than 15,000 digitised documents
      from the school's collections, serves IIIF Presentation API 2.0 manifests and
      Gallica image delivery under the hostname heritage.ecoledesponts.fr. The hostname
      is ENPC's; the deployment is not. It is the fifteenth Gallica Marque Blanche
      white-label library, the host resolves to 194.199.8.58 whose whois netname is
      FR-BNF (Bibliothèque nationale de France), manifests are attributed to the BnF and
      identifiers are BnF ARKs under naming authority 12148. This is the exact case a
      hostname-only verdict gets wrong: institution domain, institution collections,
      BnF contract and BnF infrastructure. The site's /services/engine/search/sru route
      is NOT recorded as an API — every SRU request probed, including operation=explain,
      returned the HTML search page.
    humanURL: https://heritage.ecoledesponts.fr/enpc/
    baseURL: https://heritage.ecoledesponts.fr/iiif/
